name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      - name: Typecheck frontend
        working-directory: apps/desktop
        run: npx tsc --noEmit
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: RemoteX ${{ github.ref_name }}
          releaseBody: |
            ## RemoteX v0.2.6
            - Downloads use Line 1 (internet) automatically — no URL to edit
            - Settings: Line 1 / Line 2 instead of a signaling address
            - Sharper remote desktop (higher JPEG quality, 4:4:4, native-pixel blit)
            - Default quality is Ultra clear
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
