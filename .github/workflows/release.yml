name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - platform: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: RemoteX ${{ github.ref_name }}
          releaseBody: |
            ## RemoteX v0.2.3
            - Smarter macOS permission guide on home screen and in Settings
            - Larger settings button and clearer settings sidebar
            - Tech-style connect flow: secure password modal, progress HUD, incoming request UI
            - Custom temp password, copy ID/password in one tap
            - Remote desktop streaming with mouse and keyboard control
            - macOS universal DMG + Windows NSIS installer
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
