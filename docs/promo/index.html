<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./promo.css" />
  </head>
  <body data-page="card">
    <div class="promo" id="promo">
      <header class="promo-head">
        <img src="../logo.svg" alt="" />
        <span class="promo-brand">RemoteX</span>
        <span class="promo-badge" id="badge">Home</span>
      </header>
      <div class="promo-copy">
        <h1 class="promo-title" id="title">Device ID ready</h1>
        <p class="promo-sub" id="subtitle">Copy the code. Connect in seconds.</p>
      </div>
      <div class="promo-window">
        <img id="app-shot" src="../shots/en/home.png" alt="" />
      </div>
      <div class="promo-tags" id="tags"></div>
    </div>
    <script src="./promo.js"></script>
  </body>
</html>
